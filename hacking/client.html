<!DOCTYPE html>
<html>
<head>
    <title>Hack Client</title>
</head>
<body>
<h2>Hackovací klient</h2>
<div id="chat" style="white-space: pre-line; border: 1px solid #000; padding: 10px; width: 400px; height: 200px; overflow-y: auto;"></div>
<input id="input" placeholder="Zadej název souboru">
<button onclick="sendMessage()">Odeslat</button>

<script>
const ws = new WebSocket("ws://localhost:8080");
const chat = document.getElementById("chat");

ws.onmessage = (event) => {
    chat.textContent += event.data + "\n";
    chat.scrollTop = chat.scrollHeight;
};

function sendMessage() {
    const msg = document.getElementById("input").value;
    ws.send(msg);
    document.getElementById("input").value = "";
}
</script>
</body>
</html>
